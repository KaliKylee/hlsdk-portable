name: Build Android libs

on:
  workflow_dispatch:
    inputs:
      studio_renderer:
        description: "Use the HL:E custom studio renderer (_light.mdl fullbright). Experimental on Xash3D."
        type: boolean
        default: false
  push:
    branches: [ main, master, extended ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [ arm64-v8a, armeabi-v7a ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get FreeVGUI (old vguiapi_t API, matches engine/vgui_api.h)
        run: |
          # 1) use the submodule pinned in this repo, if there is one
          if [ ! -f freevgui/CMakeLists.txt ]; then
            git submodule update --init --depth 1 freevgui || true
          fi
          # 2) otherwise clone FreeVGUI
          if [ ! -f freevgui/CMakeLists.txt ]; then
            rm -rf freevgui
            git clone https://github.com/FWGS/freevgui.git freevgui
          fi
          # 3) this repo ships the OLD engine/vgui_api.h (vguiapi_t).
          #    If FreeVGUI is already on the NEW API (vgui_support_api_t), go back to the last old-API commit.
          cd freevgui
          if grep -q vgui_support_api_t platform/xash3d-fwgs/support.h 2>/dev/null; then
            echo "FreeVGUI uses the new API, searching the last old-API commit..."
            git fetch --unshallow 2>/dev/null || true
            OLD=""
            for c in $(git rev-list HEAD -- platform/xash3d-fwgs/support.h); do
              if ! git show "$c:platform/xash3d-fwgs/support.h" 2>/dev/null | grep -q vgui_support_api_t; then
                OLD="$c"; break
              fi
            done
            if [ -z "$OLD" ]; then echo "No old-API commit found"; exit 1; fi
            echo "Using FreeVGUI commit $OLD"
            git checkout -q "$OLD"
          fi
          git log -1 --format='FreeVGUI at %h (%cs) %s' || true
          rm -rf .git
          cd ..
          ls freevgui | head

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Configure (Android NDK, ${{ matrix.abi }})
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "Using NDK: $NDK"
          STUDIO=OFF
          if [ "${{ github.event.inputs.studio_renderer }}" = "true" ]; then STUDIO=ON; fi
          cmake -G Ninja -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_APK=ON \
            -DHLEX_STUDIO_RENDERER=$STUDIO \
            -DCMAKE_INSTALL_PREFIX="$PWD/dist"

      - name: Build
        run: cmake --build build --target all -- -k 0

      - name: Install
        run: cmake --build build --target install

      - name: List result
        run: find dist -type f -exec ls -l {} \;

      - name: Upload libs (${{ matrix.abi }})
        uses: actions/upload-artifact@v4
        with:
          name: hlex-android-${{ matrix.abi }}
          path: dist/

      - name: Upload libs with symbols (${{ matrix.abi }}, for crash analysis)
        uses: actions/upload-artifact@v4
        with:
          name: HLExtended-libs-symbols-${{ matrix.abi }}
          path: build/symbols
          if-no-files-found: warn
