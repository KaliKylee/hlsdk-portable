name: Android (APK + libs)

on:
  push:
  pull_request:
  workflow_dispatch:

# Artefatos gerados:
#   AbsoluteZero-apk                 -> APK do launcher JA COM as libs dentro (e o que voce instala)
#   az-android-libs                  -> so as libs (arm64-v8a e armeabi-v7a), sem simbolos
#   az-libs-unstripped-arm64-v8a     -> libs com simbolos (depuracao: addr2line)
#   az-libs-unstripped-armeabi-v7a   -> libs com simbolos (depuracao: addr2line)
#   build-log                        -> so se o build falhar
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # O FreeVGUI ja esta dentro do repositorio (pasta freevgui/), nao precisa de submodulos.
      - uses: actions/checkout@v4

      - name: Build (arm64-v8a + armeabi-v7a)
        shell: bash
        run: |
          set -o pipefail
          rc=0
          for ABI in arm64-v8a armeabi-v7a; do
            cmake -S . -B build-$ABI -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI=$ABI \
              -DANDROID_PLATFORM=android-21 \
              -DANDROID_STL=c++_static \
              -DCMAKE_BUILD_TYPE=Release \
              -DAZ_NO_STRIP=ON 2>&1 | tee -a build.log || rc=1
            # -k 0: continua compilando para listar todos os erros de uma vez
            cmake --build build-$ABI --parallel -- -k 0 2>&1 | tee -a build.log || rc=1
          done
          exit $rc

      - name: Resumo dos erros
        if: failure()
        shell: bash
        run: |
          {
            echo '## Resumo dos erros'
            echo "Linhas com erro no log: $(grep -cE 'error:|CMake Error' build.log)"
            echo
            echo '### Mensagens distintas (quantas vezes cada uma aparece)'
            echo '```'
            grep -E 'error:|undefined (reference|symbol)|ld.lld: error|CMake Error' build.log \
              | sed -E 's#^.*(error:|CMake Error)#\1#' | sed -E 's#:[0-9]+:[0-9]+##' \
              | sort | uniq -c | sort -rn | head -25
            echo '```'
            echo '### Primeiros arquivos com erro'
            echo '```'
            grep -E 'error:' build.log | sed -E 's#/home/runner/work/[^/]*/[^/]*/##' | cut -c1-200 \
              | awk '!seen[$0]++' | head -15
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stage libs
        shell: bash
        run: |
          STRIP="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          for ABI in arm64-v8a armeabi-v7a; do
            mkdir -p jniLibs/$ABI symbols/$ABI
            cp build-$ABI/out/$ABI/*.so jniLibs/$ABI/
            cp build-$ABI/out/$ABI/*.so symbols/$ABI/
            "$STRIP" --strip-unneeded jniLibs/$ABI/*.so || true
          done
          find jniLibs symbols -type f | sort

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar SDK do Android (plataforma 34)
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      # Coloca as libs (sem simbolos) dentro do launcher e monta o APK
      - name: Build APK (launcher + libs)
        shell: bash
        working-directory: launcher
        run: |
          for ABI in arm64-v8a armeabi-v7a; do
            mkdir -p app/src/main/jniLibs/$ABI
            cp ../jniLibs/$ABI/*.so app/src/main/jniLibs/$ABI/
          done
          find app/src/main/jniLibs -name '*.so' | sort
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Nomear o APK
        shell: bash
        run: |
          mkdir -p dist
          cp launcher/app/build/outputs/apk/debug/*.apk dist/AbsoluteZero-v1.0.apk
          unzip -l dist/AbsoluteZero-v1.0.apk | grep '\.so'

      - uses: actions/upload-artifact@v4
        with:
          name: AbsoluteZero-apk
          path: dist/AbsoluteZero-v1.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: az-android-libs
          path: jniLibs

      # Libs COM simbolos, so para depurar crashes (addr2line). Nao use no APK.
      - uses: actions/upload-artifact@v4
        with:
          name: az-libs-unstripped-arm64-v8a
          path: symbols/arm64-v8a

      - uses: actions/upload-artifact@v4
        with:
          name: az-libs-unstripped-armeabi-v7a
          path: symbols/armeabi-v7a

      # O log do build so e guardado se der erro.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
