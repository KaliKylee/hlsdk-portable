name: build

# Somente Android (gamedir hrp). Gera o APK launcher e as libs por arquitetura.
on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "README.md"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"

    - name: Install NDK and CMake
      run: |
        SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
        SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
        [ -x "$SDKMANAGER" ] || SDKMANAGER="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | head -n 1)"
        echo "sdkmanager: $SDKMANAGER"
        yes | "$SDKMANAGER" --licenses > /dev/null || true
        "$SDKMANAGER" "ndk;26.1.10909125" "cmake;3.22.1"

    - name: Build APK (armeabi-v7a, arm64-v8a, x86, x86_64)
      working-directory: android
      run: |
        chmod +x gradlew
        ./gradlew assembleRelease --no-daemon

    - name: Extract libs
      run: |
        mkdir -p out
        cp android/app/build/outputs/apk/release/*.apk out/hlrats-parasomnia.apk
        unzip -o out/hlrats-parasomnia.apk "lib/*" -d out/libs
        find out/libs -type f | sort

    - name: Upload APK (launcher)
      uses: actions/upload-artifact@v4
      with:
        name: hlrats-android-apk
        path: out/hlrats-parasomnia.apk

    - name: Upload Android libs (32 e 64 bits)
      uses: actions/upload-artifact@v4
      with:
        name: hlrats-android-libs
        path: out/libs
